[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "prague"
viaIR = true
optimizer = true
optimizer_runs = 1000000
solc_version = "0.8.30"
remappings = ["solady/=lib/solady/src/"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
base = "https://mainnet.base.org"
basesepolia = "https://sepolia.base.org"
ethereum = "https://ethereum.publicnode.com"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
polygon = "https://polygon-bor-rpc.publicnode.com/"
polygonAmoy = "https://polygon-amoy-bor-rpc.publicnode.com/"
monad = "https://rpc.monad.xyz"
monadtestnet = "https://testnet-rpc.monad.xyz"
celo = "https://forno.celo.org"
arbitrum = "https://arb1.arbitrum.io/rpc"
arbitrumsepolia = "https://sepolia-rollup.arbitrum.io/rpc"
optimism = "https://mainnet.optimism.io"
optimismsepolia="https://sepolia.optimism.io"
unichain = "https://mainnet.unichain.org"
arc = "${ARC_RPC_URL}"
arcTestnet = "https://rpc.testnet.arc.network"
bnb = "https://bsc-dataseed.binance.org"
bnbTestnet = "https://bsc-testnet-rpc.publicnode.com"
robinhood="https://rpc.mainnet.chain.robinhood.com"
robinhoodtestnet="https://rpc.testnet.chain.robinhood.com"

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=8453" }
basesepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=84532" }
ethereum = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=1" }
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=11155111" }
polygon = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=137" }
arbitrum = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=42161" }
arbitrumsepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=421614" }
optimism = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=10" }
optimismsepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=11155420" }
monad = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=143" }
monadtestnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=10143" }
unichain = { key = "${ETHERSCAN_API_KEY}", url = "https://api.uniscan.xyz/api" }
